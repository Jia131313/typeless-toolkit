[package]
name = "typeless-toolkit"
version = "1.8.2"
description = "Typeless 工具集 macOS Tauri host"
authors = ["Typeless Toolkit contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
