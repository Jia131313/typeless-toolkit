name: Build and publish release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Test Windows update replacement and rollback
        run: node scripts/smoke-windows-update.js
      - run: cmd.exe /c build-public-release.bat
      - name: Verify extracted Windows release packages
        shell: pwsh
        run: |
          Get-ChildItem ..\release\*.zip | ForEach-Object {
            node scripts/smoke-release-package.js $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Release smoke test failed: $($_.Name)" }
          }
      - name: Collect Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item ..\release\*.zip, ..\release\*.sha256.txt release-assets\
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:mac:universal
      - name: Verify packaged macOS app and signature
        run: node scripts/smoke-release-package.js dist/Typeless-Toolkit-*-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/Typeless-Toolkit-*.dmg
            dist/Typeless-Toolkit-*.dmg.sha256.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/prepare-release-notes.js "$version"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "$(cat release-title.txt)"
