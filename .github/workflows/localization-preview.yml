name: Localization Windows preview

on:
  workflow_dispatch:
  push:
    branches: [codex/english-turkish-localization]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Inno Setup compiler
        run: choco install innosetup --no-progress -y
      - name: Test Windows update replacement and rollback
        run: node scripts/smoke-windows-update.js
      - run: cmd.exe /c build-public-release.bat
      - name: Verify extracted Windows release packages
        shell: pwsh
        run: |
          Get-ChildItem ..\release\*.zip | ForEach-Object {
            node scripts/smoke-release-package.js $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Release smoke test failed: $($_.Name)" }
          }
      - name: Collect Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item ..\release\*.zip, ..\release\*-setup.exe, ..\release\*.sha256.txt release-assets\
      - uses: actions/upload-artifact@v4
        with:
          name: localization-windows-preview
          path: release-assets/*
          if-no-files-found: error
